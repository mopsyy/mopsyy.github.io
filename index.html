<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mopsy — stream movies &amp; TV shows</title>
<meta name="description" content="mopsy — browse and stream movies and TV shows." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://m.media-amazon.com" />
<link rel="preconnect" href="https://www.omdbapi.com" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a class="brand" href="index.html" aria-label="mopsy home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">mopsy</span>
    </a>

    <nav class="main-nav" id="mainNav" aria-label="Primary">
      <button class="nav-link is-active" data-view="home">Home</button>
      <button class="nav-link" data-view="movie">Movies</button>
      <button class="nav-link" data-view="series">TV Shows</button>
    </nav>

    <div class="header-actions">
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 1-4.9 13.2l-3.9 3.9a1 1 0 0 1-1.4-1.4l3.9-3.9A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
        <input type="search" id="searchInput" placeholder="Search movies, TV shows…" aria-label="Search" />
        <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" hidden>&times;</button>
      </form>
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ================= HERO ================= -->
  <section class="hero" id="hero" hidden>
    <div class="hero-media"><img id="heroImg" alt="" /></div>
    <div class="hero-shade"></div>

    <div class="hero-inner">
      <div class="hero-content">
        <p class="hero-kicker" id="heroKicker">Featured</p>
        <h1 class="hero-title" id="heroTitle"></h1>
        <div class="hero-meta" id="heroMeta"></div>
        <p class="hero-overview" id="heroOverview"></p>
        <div class="hero-buttons">
          <button class="btn btn-primary" id="heroWatch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.1v13.8c0 .8.9 1.3 1.6.9l11-6.9a1 1 0 0 0 0-1.7l-11-6.9A1 1 0 0 0 8 5.1Z"/></svg>
            Watch
          </button>
          <button class="btn btn-ghost" id="heroInfo">More info</button>
        </div>
      </div>

      <figure class="hero-poster" id="heroPosterBox">
        <img id="heroPoster" alt="" />
      </figure>
    </div>

    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- ================= FILTER BAR ================= -->
  <section class="filters" id="filters">
    <div class="filters-inner">
      <div class="filters-scroll">
        <div class="seg" id="typeSeg" role="group" aria-label="Content type">
          <button class="seg-btn is-active" data-type="movie">Movies</button>
          <button class="seg-btn" data-type="series">TV Shows</button>
        </div>
        <label class="field">
          <span>Year</span>
          <select id="yearSelect" disabled><option value="">Any year</option></select>
        </label>
        <label class="field">
          <span>Sort by</span>
          <select id="sortSelect" disabled>
            <option value="relevance">Best match</option>
            <option value="title.asc">Title A – Z</option>
            <option value="year.desc">Newest first</option>
            <option value="year.asc">Oldest first</option>
          </select>
        </label>
      </div>
      <p class="filters-hint" id="filtersHint">Search a title to unlock year &amp; sort.</p>
      <button class="btn btn-quiet" id="resetFilters" hidden>Reset</button>
    </div>
  </section>

  <!-- ================= HOME ROWS ================= -->
  <div id="rows" class="rows"></div>

  <!-- ================= GRID (search results) ================= -->
  <section class="results" id="results" hidden>
    <div class="results-head">
      <h2 id="resultsTitle">Results</h2>
      <span class="results-count" id="resultsCount"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="grid-foot">
      <button class="btn btn-ghost" id="loadMore" hidden>Load more</button>
      <p class="empty" id="emptyState" hidden>No titles matched. Try a different search.</p>
    </div>
  </section>
</main>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-brand">mopsy</p>
    <p class="footer-note">Title data from the <a href="https://www.omdbapi.com/" target="_blank">OMDb</a> API. Built with a simple intention: to make streaming accessible to everyone, freely and openly.</p>
  </div>
</footer>

<!-- ================= DETAILS MODAL ================= -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Title details">
    <button class="modal-close" data-close aria-label="Close">&times;</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
